apiVersion: v1
kind: Namespace
metadata:
  name: planos
  labels:
    app: planos
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: planos-config
  namespace: planos
data:
  APP_NAME: "planos"
  ENVIRONMENT: "production"
  LOG_LEVEL: "info"
  API_PORT: "8000"
  CELERY_CONCURRENCY: "4"
---
apiVersion: v1
kind: Secret
metadata:
  name: planos-secrets
  namespace: planos
type: Opaque
stringData:
  # Replace these with actual values (use external-secrets or sealed-secrets in production)
  DATABASE_URL: "postgresql+asyncpg://planos:planos@postgres:5432/planos"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  JWT_SECRET_KEY: "REPLACE_WITH_ACTUAL_SECRET"
  SECRET_KEY: "REPLACE_WITH_ACTUAL_SECRET"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planos-api
  namespace: planos
  labels:
    app: planos
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: planos
      component: api
  template:
    metadata:
      labels:
        app: planos
        component: api
    spec:
      containers:
        - name: api
          image: planos:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: planos-config
            - secretRef:
                name: planos-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: planos-worker
  namespace: planos
  labels:
    app: planos
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: planos
      component: worker
  template:
    metadata:
      labels:
        app: planos
        component: worker
    spec:
      containers:
        - name: worker
          image: planos:latest
          command: ["celery", "-A", "planos.app.workers.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: planos-config
            - secretRef:
                name: planos-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: planos-api
  namespace: planos
spec:
  selector:
    app: planos
    component: api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: planos
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: planos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: planos-ingress
  namespace: planos
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  rules:
    - host: planos.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: planos-api
                port:
                  number: 80
